name: Publish limited Community to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install official MCP publisher
        run: |
          curl -L -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate seven-tool manifest
        run: ./mcp-publisher validate server.json
      - name: Authenticate with repository-bound GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish and reconcile registry state idempotently
        run: node scripts/sync-registry.mjs --apply
